name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Max releases to fetch details for (0 = all)
        default: "0"
      batches:
        description: Run this many builds back to back while artist and label profiles are left (use with a number in entities)
        default: "1"
      entities:
        description: Discogs requests for artist and label profiles ("all" = every missing profile, "sample" = just the top artist and label, empty = none)
        default: ""
      audio:
        description: Measure BPM and energy for up to this many tracks ("all" = every track not measured yet, empty = none)
        default: ""
      refresh:
        description: Re-fetch market stats and prices for this many of the stalest releases ("all" = every release, empty = none)
        default: ""

permissions:
  contents: read
  actions: write  # a batched manual run starts the next batch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)  # decodes preview clips for BPM and energy
      - id: pages
        uses: actions/configure-pages@v5
      # The live bundle is the cache: only new records and the stalest market stats are re-fetched.
      - name: Download previous library
        run: curl -fsSL -o data/library.enc "${{ steps.pages.outputs.base_url }}/data/library.enc" || rm -f data/library.enc
      - name: Fetch collection and encrypt
        id: build
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          DISCOGS_USERNAME: ${{ secrets.DISCOGS_USERNAME }}
          LISTENER_PASSWORD: ${{ secrets.LISTENER_PASSWORD }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          CLUSTER_KEY: ${{ secrets.CLUSTER_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        # Slow lookups (market refresh, Apple previews) only run nightly so pushes deploy in minutes.
        run: python scripts/build_data.py --refresh ${{ inputs.refresh == 'all' && 1000000 || inputs.refresh || (github.event_name == 'schedule' && 500 || 0) }} --apple ${{ github.event_name == 'schedule' && 500 || 0 }} --spotify ${{ github.event_name != 'push' && 1500 || 0 }} --entities ${{ inputs.entities == 'all' && 1000000 || inputs.entities || (github.event_name == 'schedule' && 900 || 0) }} --audio ${{ inputs.audio == 'all' && 1000000 || inputs.audio || (github.event_name == 'schedule' && 3000 || 0) }} --limit ${{ inputs.limit || 0 }}
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r index.html manifest.webmanifest icon.svg icon.png css js _site/
          cp data/library.enc _site/data/
          # Version every asset URL so browsers pick up a new deploy immediately.
          v=${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}
          sed -i -E "s#(from '\./[a-z]+\.js)'#\1?v=$v'#g" _site/js/*.js
          sed -i -E "s#(src=\"js/app\.js|href=\"css/styles\.css)\"#\1?v=$v\"#g" _site/index.html
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
      # Batched profile fetching: each batch deploys what it fetched, then starts the next one.
      - name: Start next batch
        if: github.event_name == 'workflow_dispatch' && fromJSON(inputs.batches || '1') > 1 && steps.build.outputs.entities_left != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f entities="${{ inputs.entities }}" -f batches="$(( ${{ inputs.batches }} - 1 ))"
